name: Build Android APK

on:
  workflow_dispatch:        # cho phép bấm chạy thủ công
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'config.js'
      - 'manifest.json'
      - 'sw.js'
      - 'logo.png'
      - 'icon-*.png'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Chuẩn bị thư mục www
        run: |
          mkdir www
          cp index.html config.js manifest.json sw.js logo.png icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Cài Capacitor và tạo dự án Android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Thêm quyền camera
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          add = ('    <uses-permission android:name="android.permission.CAMERA" />\n'
                 '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n')
          s = s.replace('</manifest>', add + '</manifest>')
          s = s.replace('<application', '<application android:largeHeap="true"', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Đặt biểu tượng và màn hình chờ cho app
        run: |
          pip install pillow
          python3 - <<'PY'
          import os, glob
          from PIL import Image
          res = 'android/app/src/main/res'
          icon = Image.open('www/icon-512.png').convert('RGB')
          fore = Image.open('www/icon-maskable-512.png').convert('RGB')
          legacy = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          adaptive = {'mdpi': 108, 'hdpi': 162, 'xhdpi': 216, 'xxhdpi': 324, 'xxxhdpi': 432}
          for d in legacy:
              folder = os.path.join(res, 'mipmap-' + d)
              for name in ('ic_launcher.png', 'ic_launcher_round.png'):
                  icon.resize((legacy[d], legacy[d]), Image.LANCZOS).save(os.path.join(folder, name))
              fore.resize((adaptive[d], adaptive[d]), Image.LANCZOS).save(os.path.join(folder, 'ic_launcher_foreground.png'))
          # Màn hình chờ (Android 11 trở xuống): nền trắng, logo ở giữa
          for f in glob.glob(os.path.join(res, 'drawable*', 'splash.png')):
              os.remove(f)
          logo = Image.open('www/logo.png').convert('RGBA')
          w = 560
          logo = logo.resize((w, round(logo.height * w / logo.width)), Image.LANCZOS)
          os.makedirs(os.path.join(res, 'drawable-nodpi'), exist_ok=True)
          logo.save(os.path.join(res, 'drawable-nodpi', 'splash_logo.png'))
          xml = """<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />
              <item>
                  <bitmap android:src="@drawable/splash_logo" android:gravity="center" />
              </item>
          </layer-list>
          """
          xml = '\n'.join(line.lstrip() if i else line for i, line in enumerate(xml.split('\n')))
          with open(os.path.join(res, 'drawable', 'splash.xml'), 'w', encoding='utf-8') as fh:
              fh.write(xml)
          PY

      - name: Đóng gói APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Đổi tên và tải lên file APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ID-EScan.apk

      - name: Lưu file APK
        uses: actions/upload-artifact@v4
        with:
          name: ID-EScan-apk
          path: ID-EScan.apk
