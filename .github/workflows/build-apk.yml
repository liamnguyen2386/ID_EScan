name: Build Android APK

on:
  workflow_dispatch:        # cho phép bấm chạy thủ công
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'config.js'
      - 'manifest.json'
      - 'sw.js'
      - 'logo.png'
      - 'icon-*.png'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Chuẩn bị thư mục www
        run: |
          mkdir www
          cp index.html config.js manifest.json sw.js logo.png icon-192.png icon-512.png www/

      - name: Cài Capacitor và tạo dự án Android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Thêm quyền camera
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          add = ('    <uses-permission android:name="android.permission.CAMERA" />\n'
                 '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n')
          s = s.replace('</manifest>', add + '</manifest>')
          s = s.replace('<application', '<application android:largeHeap="true"', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Đặt biểu tượng app
        run: |
          pip install pillow
          python3 - <<'PY'
          import os
          from PIL import Image
          res = 'android/app/src/main/res'
          src = Image.open('www/icon-512.png').convert('RGB')
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for d, n in sizes.items():
              img = src.resize((n, n), Image.LANCZOS)
              for name in ('ic_launcher.png', 'ic_launcher_round.png'):
                  img.save(os.path.join(res, 'mipmap-' + d, name))
          for f in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              p = os.path.join(res, 'mipmap-anydpi-v26', f)
              if os.path.exists(p):
                  os.remove(p)
          PY

      - name: Đóng gói APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Đổi tên và tải lên file APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ID-EScan.apk

      - name: Lưu file APK
        uses: actions/upload-artifact@v4
        with:
          name: ID-EScan-apk
          path: ID-EScan.apk
